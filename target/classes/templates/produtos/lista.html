<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Gestão de Produtos
        </h2>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulário de Cadastro (reaproveitado para novo e edição) -->
    <div class="collapse mb-4" id="formularioProduto">
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/produtos/salvar}" method="post" id="produtoForm">
                    <input type="hidden" id="produtoId" name="id">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select id="tipo" name="tipo" class="form-select" required>
                                <option value="" disabled selected>Selecione</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" id="preco" name="preco" class="form-control" placeholder="0,00" step="0.01" required>
                        </div>

                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input type="checkbox" id="ativo" name="ativo" class="form-check-input" checked>
                                <label for="ativo" class="form-check-label">Ativo</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#formularioProduto">Cancelar</button>
                        <button type="submit" class="btn btn-success">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">Nome</th>
                    <th>Tipo</th>
                    <th>Preço</th>
                    <th class="text-center">Status</th>
                    <th class="text-end pe-4">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum produto cadastrado.
                    </td>
                </tr>
                <tr th:each="produto : ${produtos}">
                    <td class="ps-4 fw-bold" th:text="${produto.nome}"></td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${produto.tipo}"></span>
                    </td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco ?: 0, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="text-center">
                        <span th:if="${produto.ativo}" class="badge bg-success">Ativo</span>
                        <span th:unless="${produto.ativo}" class="badge bg-danger">Inativo</span>
                    </td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-primary"
                                type="button"
                                th:data-id="${produto.id}"
                                th:data-nome="${produto.nome}"
                                th:data-tipo="${produto.tipo}"
                                th:data-preco="${produto.preco ?: 0}"
                                th:data-ativo="${produto.ativo ?: false}"
                                onclick="preencherFormulario(this)">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Excluir este produto?');">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        function preencherFormulario(botao) {
            const id = botao.dataset.id;
            const nome = botao.dataset.nome;
            const tipo = botao.dataset.tipo;
            const preco = botao.dataset.preco;
            const ativo = botao.dataset.ativo === 'true';

            document.getElementById('produtoId').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('tipo').value = tipo;
            document.getElementById('preco').value = preco;
            document.getElementById('ativo').checked = ativo;

            const formulario = document.getElementById('formularioProduto');

            const bootstrapCollapse = bootstrap.Collapse.getOrCreateInstance(formulario, {
                toggle: false
            });

            bootstrapCollapse.show();

            window.scrollTo(0, 0);
        }
    </script>
</div>
</body>
</html>
