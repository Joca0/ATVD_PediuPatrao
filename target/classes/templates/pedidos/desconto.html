<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Aplicar Desconto</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Aplicar Desconto</h2>
    </div>

    <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body p-4">
            <p>Pedido <strong>#<span th:text="${pedido.id}"></span></strong></p>
            <p>Valor Bruto: <strong>R$ <span th:text="${#numbers.formatDecimal(pedido.valorBruto, 1, 'COMMA', 2, 'POINT')}"></span></strong></p>
            
            <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post">
                <div class="mb-3">
                    <label for="percentual" class="form-label fw-medium">Percentual de Desconto (%)</label>
                    <input type="number" id="percentual" name="percentual" class="form-control" 
                           step="0.1" min="0" max="20" th:value="${pedido.desconto}" required>
                    <div class="form-text">Máximo de 20% permitido.</div>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">Aplicar</button>
                    <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
