<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">Cliente</label>
                    <select id="clienteId" th:field="*{clienteId}" class="form-select" required>
                        <option value="">Selecione um cliente...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">Itens do Pedido</h5>
            </div>
            <div class="card-body p-4">
                <div id="itens-container">
                    <div class="row mb-3 item-row">
                        <div class="col-md-8">
                            <label class="form-label">Produto</label>
                            <select name="produtoIds" class="form-select" required>
                                <option value="">Selecione um produto...</option>
                                <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome} + ' - R$ ' + ${p.preco}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Qtd</label>
                            <input type="number" name="quantidades" class="form-control" value="1" min="1" required>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="button" class="btn btn-outline-danger" onclick="removerItem(this)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="adicionarItem()">
                    <i class="bi bi-plus-lg"></i> Adicionar Item
                </button>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> Registrar Pedido
            </button>
            <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

    <script>
        function adicionarItem() {
            const container = document.getElementById('itens-container');
            const firstRow = container.querySelector('.item-row');
            const newRow = firstRow.cloneNode(true);
            newRow.querySelector('select').value = '';
            newRow.querySelector('input').value = '1';
            container.appendChild(newRow);
        }

        function removerItem(btn) {
            const container = document.getElementById('itens-container');
            if (container.querySelectorAll('.item-row').length > 1) {
                btn.closest('.item-row').remove();
            } else {
                alert('O pedido deve ter pelo menos um item.');
            }
        }
    </script>
</div>

</body>
</html>
