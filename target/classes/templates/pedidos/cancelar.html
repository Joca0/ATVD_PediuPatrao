<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cancelar Pedido</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0 text-danger">Cancelar Pedido</h2>
    </div>

    <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body p-4">
            <p>Você está prestes a cancelar o pedido <strong>#<span th:text="${pedido.id}"></span></strong>.</p>
            
            <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post">
                <div class="mb-3">
                    <label for="motivo" class="form-label fw-medium">Motivo do Cancelamento</label>
                    <textarea id="motivo" name="motivo" class="form-control" rows="3" required placeholder="Informe o motivo..."></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Confirmar Cancelamento</button>
                    <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
